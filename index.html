<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff">
<title>Daily Time Log · 每日时间记录</title>
<style>
:root{color-scheme:light;--ink:#262a2e;--muted:#687078;--line:#e8eaed;--accent:#356a59;--soft:#f4f7f5}*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{max-width:820px;margin:auto;padding:48px 28px 32px}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:8px;min-height:44px;padding:8px 14px}button:hover{background:var(--soft)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #8ab5a6;outline-offset:2px}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#295444}h1{font-size:25px;letter-spacing:-.6px;margin:0;font-weight:650}.eyebrow{color:var(--muted);font-size:14px;margin:5px 0 0}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:24px}.datebar input{border:0;background:transparent;font-weight:600;width:160px;min-height:44px;padding:4px}.arrow{font-size:21px;padding:4px 12px}.weekday{color:var(--muted);font-size:14px;margin-left:auto}.dayheading{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px;color:var(--muted);font-size:14px}.entry{display:grid;grid-template-columns:115px 1fr auto;gap:16px;padding:17px 0;border-bottom:1px solid #f0f1f2;align-items:start}.times{font-size:14px;font-variant-numeric:tabular-nums;line-height:1.8;padding-top:1px}.next{font-size:12px;color:var(--muted)}.entrytext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.meta{color:var(--muted);font-size:13px;margin-top:3px}.actions{display:flex;gap:2px}.actions button{border:0;font-size:13px;color:var(--muted);padding:5px 7px;min-height:36px}.empty{text-align:center;padding:48px 16px;color:var(--muted)}.empty p{margin:6px 0 18px}.empty strong{font-size:18px;color:var(--ink)}.addline{width:100%;margin-top:16px;border-style:dashed;color:var(--accent)}.summary{margin-top:38px;border-top:2px solid var(--ink);padding-top:20px}.summary h2{font-size:19px;margin:0}.summaryhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.summaryhead span{font-size:14px;color:var(--muted)}.totals{display:grid;grid-template-columns:1fr 1fr;gap:0 36px;margin:16px 0}.total{display:flex;gap:12px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.total strong{font-weight:600;white-space:nowrap}.subtotals{font-size:13px;color:var(--muted);line-height:2}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 12px}.tools button{font-size:14px}.footnote{font-size:13px;color:var(--muted);margin:6px 0}.notice{color:#945223;background:#fff8ed;padding:10px 14px;border-radius:6px;font-size:14px;margin:12px 0}.hidden,[hidden]{display:none!important}dialog{border:1px solid var(--line);border-radius:16px;width:min(540px,calc(100% - 24px));max-height:90dvh;padding:26px;box-shadow:0 20px 80px #0002}dialog::backdrop{background:#15231b55}dialog h2{font-size:20px;margin:0 0 20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:14px}input,select,textarea{display:block;width:100%;background:white;border:1px solid #d4d9d6;border-radius:7px;padding:10px;min-width:0;margin-top:5px}textarea{resize:vertical;min-height:100px}.wide{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px}.check input{width:19px;height:19px;margin:0}.formfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.hint{color:var(--muted);font-size:13px;margin:10px 0}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#263d33;color:white;padding:10px 20px;border-radius:10px;max-width:90vw;font-size:14px;z-index:10}.copyarea{width:100%;height:260px;font-size:14px}@media(max-width:560px){main{padding:24px 18px}h1{font-size:22px}header{margin-bottom:24px}.entry{grid-template-columns:96px 1fr;gap:7px 12px}.actions{grid-column:2;justify-content:flex-end;margin-top:-6px}.entrytext{font-size:16px}.times{font-size:13px}.weekday{margin-left:0}.totals{gap:0 18px}.total{font-size:13px}.summaryhead{flex-wrap:wrap}.formgrid{gap:12px}dialog{padding:20px}.datebar{gap:5px}.datebar input{width:148px}}@media print{header button,.datebar button,.actions,.addline,.tools,.footnote,.notice,.toast{display:none!important}main{max-width:none;padding:0}.entry{break-inside:avoid}.summary{break-inside:avoid}}
</style>
</head>
<body><main>
<header><div><h1>Daily Time Log</h1><p class="eyebrow">每日时间记录</p></div><button class="primary" id="add">＋ 记录</button></header>
<nav class="datebar" aria-label="切换日期"><button class="arrow" id="prev" aria-label="前一天">‹</button><input id="date" type="date" min="1900-01-01" max="9999-12-31" aria-label="记录日期"><button class="arrow" id="next" aria-label="后一天">›</button><button id="today">今天</button><span class="weekday" id="weekday"></span></nav>
<div id="storageWarning" class="notice" role="alert" hidden></div><div class="dayheading"><span id="dateTitle"></span><span id="count"></span></div>
<section id="entries" aria-label="当天时间记录"></section><button id="addBottom" class="addline">＋ 添加时间段</button><div class="notice" id="overlap" hidden>有时间段重叠；汇总按每条记录相加，重叠时间会重复计入。</div>
<section class="summary"><div class="summaryhead"><h2>Daily Summary</h2><span id="totalTime"></span></div><div id="totals" class="totals"></div><div id="subtotals" class="subtotals"></div></section>
<footer><div class="tools"><button id="copy">复制当天记录</button><button id="export">导出全部备份</button><button id="import">导入备份</button><input type="file" id="file" accept=".json,application/json" hidden></div><p id="saveState" class="footnote">记录保存在当前浏览器，无需账号。</p><p class="footnote">手机和 Mac 不会自动同步，可通过 JSON 备份转移。建议定期导出备份。</p><p class="footnote">跨午夜的记录及完整时长归入开始日期；时长按时间段计算。</p></footer>
</main>
<dialog id="editor" aria-labelledby="editTitle"><form id="form"><h2 id="editTitle">添加时间段</h2><div class="formgrid"><label>开始时间<input type="time" id="start" required></label><label>结束时间<input type="time" id="end" required></label><label class="check wide"><input type="checkbox" id="overnight">结束于次日</label><label>类别<select id="category"></select></label><label>Emoji<input id="emoji" maxlength="24" required aria-label="记录 emoji"></label><label class="wide" id="subwrap">细分类别<select id="subcategory"></select></label><label class="wide">内容<textarea id="content" maxlength="5000" placeholder="例如：消化系统病例学完，复习 legen 单词" required></textarea></label></div><p class="hint" id="durationHint">选择开始和结束时间</p><p class="notice" id="formError" role="alert" hidden></p><div class="formfoot"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存记录</button></div></form></dialog>
<dialog id="textDialog" aria-labelledby="textTitle"><h2 id="textTitle">当天记录</h2><p class="hint">如果浏览器不支持自动复制，请长按或全选下方文字复制。</p><textarea class="copyarea" id="plainText" readonly></textarea><div class="formfoot"><button id="closeText">完成</button></div></dialog><div id="toast" class="toast" role="status" hidden></div>
<script>
'use strict';
const KEY='daily-time-log.v1';
const CATEGORIES={study:{label:'学习',emoji:'📚',subs:['FSP病例','医学德语','单词','Arztbrief','口语训练','其他学习']},writing:{label:'Arztbrief / 文章',emoji:'📝',subs:['文章','Arztbrief']},exercise:{label:'运动',emoji:'🧘',subs:[]},chores:{label:'家务',emoji:'🧹',subs:[]},food:{label:'吃饭',emoji:'🍳',subs:[]},sleep:{label:'睡眠 / 午睡',emoji:'😴',subs:['睡眠','午睡']},other:{label:'其他',emoji:'🌿',subs:[]}};
const $=id=>document.getElementById(id);
const today=()=>localDate(new Date());
function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function validDate(s){if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)||s<'1900-01-01')return false;const d=new Date(s+'T12:00:00');return !isNaN(d)&&localDate(d)===s}
const validTime=t=>typeof t==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(t);
const minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3));
const duration=e=>minutes(e.end)-minutes(e.start)+(e.overnight?1440:0);
const fmt=n=>n>=60?`${Math.floor(n/60)} h${n%60?' '+n%60+' min':''}`:`${n} min`;
function validate(raw){if(!raw||raw.version!==1||!Array.isArray(raw.entries)||raw.entries.length>100000)throw Error('备份格式不正确');const ids=new Set();return {version:1,entries:raw.entries.map(e=>{if(!e||typeof e.id!=='string'||!e.id||e.id.length>100||ids.has(e.id)||!validDate(e.date)||!validTime(e.start)||!validTime(e.end)||!Object.hasOwn(CATEGORIES,e.category)||typeof e.overnight!=='boolean'||typeof e.content!=='string'||!e.content.trim()||e.content.length>5000||typeof e.emoji!=='string'||!e.emoji.trim()||e.emoji.length>24||typeof e.subcategory!=='string'||(CATEGORIES[e.category].subs.length?!CATEGORIES[e.category].subs.includes(e.subcategory):e.subcategory!=='' )||duration(e)<=0||duration(e)>1440)throw Error('备份含有无效或重复记录');ids.add(e.id);return {id:e.id,date:e.date,start:e.start,end:e.end,category:e.category,subcategory:e.subcategory,emoji:e.emoji,content:e.content,overnight:e.overnight}})}}
let data={version:1,entries:[]},blocked=false,editing=null,selected=today(),toastTimer;
function warning(s){$('storageWarning').textContent=s;$('storageWarning').hidden=false}
try{const raw=localStorage.getItem(KEY);if(raw)data=validate(JSON.parse(raw))}catch(e){blocked=true;warning('无法读取本地记录，已停止覆盖保存。请检查浏览器存储权限，或导入有效备份恢复。')}
function commit(next){if(blocked){warning('本地存储不可用，修改暂存在本页。关闭前请导出备份。');data=next;render();return false}try{localStorage.setItem(KEY,JSON.stringify(next));data=next;$('storageWarning').hidden=true;$('saveState').textContent='已自动保存到当前浏览器。';render();return true}catch(e){data=next;warning('保存失败，修改暂存在本页。关闭前请导出备份，并检查浏览器存储空间。');render();return false}}
function toast(s){clearTimeout(toastTimer);$('toast').textContent=s;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3200)}
function dayEntries(){return data.entries.filter(e=>e.date===selected).sort((a,b)=>a.start.localeCompare(b.start)||a.end.localeCompare(b.end))}
function sumEntries(entries){const totals=Object.fromEntries(Object.keys(CATEGORIES).map(k=>[k,0]));const subs={};for(const e of entries){totals[e.category]+=duration(e);if(e.subcategory){const k=e.category+':'+e.subcategory;subs[k]=(subs[k]||0)+duration(e)}}return {totals,subs,total:entries.reduce((a,e)=>a+duration(e),0)}}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function render(){const list=dayEntries(),sum=sumEntries(list);$('date').value=selected;$('dateTitle').textContent=selected.split('-').reverse().join('.');$('weekday').textContent=new Date(selected+'T12:00:00').toLocaleDateString('zh-CN',{weekday:'long'});$('count').textContent=`${list.length} 条记录`;$('entries').replaceChildren();if(!list.length){const empty=el('div','empty');empty.append(el('strong','','这一天，还没有记录'),el('p','','从早餐、学习，或一小段休息开始。'));$('entries').append(empty)}for(const e of list){const row=el('article','entry'),time=el('div','times',`${e.start}–${e.end}`);if(e.overnight)time.append(el('div','next','结束于次日'));const body=el('div');body.append(el('div','entrytext',e.emoji+' '+e.content),el('div','meta',`${CATEGORIES[e.category].label}${e.subcategory?' · '+e.subcategory:''} · ${fmt(duration(e))}`));const actions=el('div','actions');const edit=el('button','','编辑'),del=el('button','','删除');edit.setAttribute('aria-label','编辑 '+e.content);del.setAttribute('aria-label','删除 '+e.content);edit.onclick=()=>openEditor(e);del.onclick=()=>{if(confirm(`删除 ${e.start}–${e.end} 的记录“${e.content.slice(0,60)}”？`)){const ok=commit({...data,entries:data.entries.filter(x=>x.id!==e.id)});toast(ok?'已删除':'已删除，请导出备份保存')}};actions.append(edit,del);row.append(time,body,actions);$('entries').append(row)}$('totals').replaceChildren();for(const [k,c] of Object.entries(CATEGORIES)){const item=el('div','total');item.append(el('span','',c.emoji+' '+c.label),el('strong','',fmt(sum.totals[k])));$('totals').append(item)}$('totalTime').textContent='已记录 '+fmt(sum.total);$('subtotals').replaceChildren();for(const [key,value] of Object.entries(sum.subs)){const [category,sub]=key.split(':');$('subtotals').append(el('div','',`${CATEGORIES[category].label} · ${sub}：${fmt(value)}`))}let end=-1,overlap=false;for(const e of list){if(minutes(e.start)<end)overlap=true;end=Math.max(end,minutes(e.start)+duration(e))}$('overlap').hidden=!overlap}
function setDate(s){if(validDate(s)){selected=s;render()}else $('date').value=selected}
function shift(n){const d=new Date(selected+'T12:00:00');d.setDate(d.getDate()+n);setDate(localDate(d))}
for(const [key,c] of Object.entries(CATEGORIES))$('category').add(new Option(c.emoji+' '+c.label,key));
function updateSub(value){const subs=CATEGORIES[$('category').value].subs;$('subcategory').replaceChildren();subs.forEach(s=>$('subcategory').add(new Option(s,s)));$('subwrap').hidden=!subs.length;if(value&&subs.includes(value))$('subcategory').value=value}
function hint(){const e={start:$('start').value,end:$('end').value,overnight:$('overnight').checked};const n=validTime(e.start)&&validTime(e.end)?duration(e):0;$('durationHint').textContent=n>0&&n<=1440?`时长 ${fmt(n)}${e.overnight?' · 归入 '+selected:''}`:'请检查时间；跨午夜请勾选“结束于次日”。'}
function openEditor(e){editing=e?.id||null;$('form').reset();$('formError').hidden=true;$('editTitle').textContent=e?'编辑时间段':'添加时间段';$('category').value=e?.category||'study';updateSub(e?.subcategory);$('emoji').value=e?.emoji||CATEGORIES.study.emoji;if(e){for(const k of ['start','end','content'])$(k).value=e[k];$('overnight').checked=e.overnight}else{const last=dayEntries().at(-1);if(last&&!last.overnight){$('start').value=last.end;const end=minutes(last.end)+30;$('end').value=`${String(Math.floor(end/60)%24).padStart(2,'0')}:${String(end%60).padStart(2,'0')}`;$('overnight').checked=end>=1440}}hint();$('editor').showModal();(e?$('content'):$('start')).focus()}
$('category').onchange=()=>{updateSub();$('emoji').value=CATEGORIES[$('category').value].emoji};for(const k of ['start','end','overnight'])$(k).oninput=hint;
$('form').onsubmit=event=>{event.preventDefault();const entry={id:editing||(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)),date:selected,start:$('start').value,end:$('end').value,category:$('category').value,subcategory:$('subcategory').value,emoji:$('emoji').value.trim(),content:$('content').value.trim(),overnight:$('overnight').checked};try{validate({version:1,entries:[entry]})}catch(e){$('formError').hidden=false;$('formError').textContent='请填写内容和 emoji，确认时长大于 0 且不超过 24 小时。';return}const entries=data.entries.filter(x=>x.id!==entry.id);entries.push(entry);const ok=commit({version:1,entries});$('editor').close();toast(ok?'记录已保存':'记录暂存在本页，请导出备份')};
$('cancel').onclick=()=>$('editor').close();$('add').onclick=()=>openEditor();$('addBottom').onclick=()=>openEditor();$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('today').onclick=()=>setDate(today());$('date').onchange=()=>setDate($('date').value);
function plainText(){const entries=dayEntries(),sum=sumEntries(entries);return [selected.split('-').reverse().join('.'),'',...entries.map(e=>`${e.start}–${e.end}${e.overnight?'（次日）':''} ${e.emoji} ${e.content} [${CATEGORIES[e.category].label}${e.subcategory?' / '+e.subcategory:''}] (${fmt(duration(e))})`),'','Daily Summary',...Object.entries(CATEGORIES).map(([k,c])=>`${c.emoji} ${c.label}：${fmt(sum.totals[k])}`),...Object.entries(sum.subs).map(([k,n])=>`${k.split(':')[1]}：${fmt(n)}`),'已记录：'+fmt(sum.total),'跨午夜记录归入开始日期；重叠时间按记录相加。'].join('\n')}
$('copy').onclick=async()=>{const text=plainText();try{await navigator.clipboard.writeText(text);toast('已复制当天记录')}catch(e){$('plainText').value=text;$('textDialog').showModal();$('plainText').focus();$('plainText').select()}};$('closeText').onclick=()=>$('textDialog').close();
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({...data,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='daily-time-log-backup-'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('已导出全部日期的备份')};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;try{if(file.size>25*1024*1024)throw Error('备份文件不能超过 25 MB');const imported=validate(JSON.parse(await file.text()));if(!imported.entries.length){toast('备份中没有记录');return}const conflicts=imported.entries.filter(e=>data.entries.some(x=>x.id===e.id));if(!confirm(`导入 ${imported.entries.length} 条记录？保留现有记录，相同编号的 ${conflicts.length} 条记录使用备份版本。`))return;const merged=new Map(data.entries.map(e=>[e.id,e]));imported.entries.forEach(e=>merged.set(e.id,e));const next={version:1,entries:[...merged.values()]};if(blocked){try{localStorage.setItem(KEY,JSON.stringify(next));blocked=false;$('storageWarning').hidden=true}catch(e){}}const ok=commit(next);toast(ok?'备份已导入并保存':'已导入本页，但本地保存不可用')}catch(e){alert('未导入：'+(e instanceof SyntaxError?'文件不是有效 JSON。':e.message))}finally{$('file').value=''}};
window.addEventListener('storage',e=>{if(e.key===KEY){try{data=e.newValue?validate(JSON.parse(e.newValue)):{version:1,entries:[]};if($('editor').open){$('editor').close();toast('记录已在另一窗口更新，请重新编辑')}render()}catch(err){warning('另一窗口的数据无法读取，请先导出当前备份。')}}});
render();
</script></body></html>
